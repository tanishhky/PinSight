name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"  # matches the production launchd venv; RND numerics are scipy-version sensitive
          cache: pip
      - run: pip install -e . pytest
      - run: pytest tests/ -q
